<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Счётчик кликов</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #counter { font-size: 24px; font-weight: bold; margin: 10px 0; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Счётчик кликов</h2>
    <button id="click-btn">Нажми меня</button>
    <div id="counter">Кликов: 0</div>

    <script>
        let count = 0;
        const button = document.querySelector('#click-btn');
        const counterDisplay = document.querySelector('#counter');

        button.addEventListener('click', () => {
            count++;
            counterDisplay.textContent = `Кликов: ${count}`;
        });
    </script>
</body>
</html>
