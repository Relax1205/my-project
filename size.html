<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление размером</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .controls { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        button { 
            padding: 12px 24px; 
            font-size: 20px; 
            cursor: pointer;
            min-width: 50px;
        }
        #box {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            transition: width 0.2s, height 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        #size-display {
            margin-top: 15px;
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>
    <h2>Управление размером</h2>
    
    <div class="controls">
        <button id="decrease">−</button>
        <button id="increase">+</button>
    </div>
    
    <div id="box">100×100</div>
    <div id="size-display">Размер: 100px</div>

    <script>
        const box = document.querySelector('#box');
        const increaseBtn = document.querySelector('#increase');
        const decreaseBtn = document.querySelector('#decrease');
        const sizeDisplay = document.querySelector('#size-display');
        
        let size = 100;
        const step = 10;
        const minSize = 50;
        const maxSize = 300;

        function updateBox() {
            box.style.width = `${size}px`;
            box.style.height = `${size}px`;
            box.textContent = `${size}×${size}`;
            sizeDisplay.textContent = `Размер: ${size}px`;
        }

        increaseBtn.addEventListener('click', () => {
            if (size < maxSize) {
                size += step;
                updateBox();
            }
        });

        decreaseBtn.addEventListener('click', () => {
            if (size > minSize) {
                size -= step;
                updateBox();
            }
        });
    </script>
</body>
</html>
