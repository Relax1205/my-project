<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список дел</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        #todo-input { flex: 1; padding: 10px; font-size: 16px; }
        #add-btn { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { 
            padding: 10px 15px; 
            margin: 5px 0; 
            background: #f4f4f4; 
            border-left: 4px solid #3498db;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
        }
        .delete-btn:hover { background: #c0392b; }
        .empty { color: #999; font-style: italic; }
    </style>
</head>
<body>
    <h2>Список дел</h2>
    <div class="input-group">
        <input type="text" id="todo-input" placeholder="Что нужно сделать?">
        <button id="add-btn">Добавить</button>
    </div>
    <ul id="todo-list">
        <li class="empty">Пока нет дел. Добавьте первое!</li>
    </ul>

    <script>
        const input = document.querySelector('#todo-input');
        const addButton = document.querySelector('#add-btn');
        const todoList = document.querySelector('#todo-list');
        let isEmpty = true;

        function addTodo() {
            const text = input.value.trim();
            if (!text) return;

            if (isEmpty) {
                todoList.innerHTML = '';
                isEmpty = false;
            }
            const li = document.createElement('li');
            
            const span = document.createElement('span');
            span.textContent = text;
            
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = '✕';
            deleteBtn.className = 'delete-btn';
            deleteBtn.addEventListener('click', () => {
                li.remove();
                if (todoList.children.length === 0) {
                    todoList.innerHTML = '<li class="empty">Пока нет дел. Добавьте первое!</li>';
                    isEmpty = true;
                }
            });

            li.appendChild(span);
            li.appendChild(deleteBtn);
            todoList.appendChild(li);

            input.value = '';
            input.focus();
        }

        addButton.addEventListener('click', addTodo);

        input.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                addTodo();
            }
        });
    </script>
</body>
</html>
